<!DOCTYPE html>
<!--
  VCP | PROTOTIPO VISUAL del panel de conciliación (sin conexión a ningún sistema).
  - Datos 100 % FICTICIOS, definidos abajo en DATOS_FICTICIOS. No hay google.script.run, ni Sheets, ni Drive, ni BAC.
  - Las acciones (registrar, aprobar, rechazar) solo cambian la memoria de esta página y se pierden al recargar.
  - Un solo archivo con CSS y JS integrados, sin librerías externas: el mismo formato que las páginas de
    Apps Script (HtmlService) del proyecto, para poder integrarlo después sin cambiar la arquitectura.
  - Logo: se carga desde logo-vcp.png (el archivo oficial, sin modificar). Si falta, se muestra un espacio reservado.
-->
<html lang="es">
<head>

  <title>VCP Conciliación · Prototipo</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">

  <style>
    :root {
      --violeta: #292E85; --violeta-2: #1F2368; --violeta-3: #3A40A0;
      --turquesa: #12DFDD; --turquesa-osc: #0BB3B1;
      --fucsia: #E31C69; --azul: #3F93C6;
      --fondo: #F5F7FC; --superficie: #FFFFFF; --borde: #E1E5F0;
      --tinta: #1B1F45; --tinta-2: #4A5072; --tinta-3: #6E7491;
      --ok: #137A4B; --ok-f: #E3F5EC; --aviso: #9A5B00; --aviso-f: #FFF3DC;
      --grave: #B3261E; --grave-f: #FDE7E5; --info-f: #E6F1F9;
      --radio: 12px; --sombra: 0 1px 2px rgba(27,31,69,.06), 0 4px 16px rgba(27,31,69,.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: Nunito, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--tinta); background: var(--fondo); font-size: 14px; line-height: 1.45; }
    button, select, input { font: inherit; }
    a { color: var(--azul); }

    /* ---------- Estructura ---------- */
    .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
    .lateral { background: linear-gradient(180deg, #23276F 0%, var(--violeta) 55%, #2E2A86 100%); color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .marca { padding: 18px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; align-items: flex-start; }
    .logo { display: block; }
    .logo img { display: block; height: 92px; width: auto; }
    .logo .reservado { height: 92px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: #fff; border: 1px dashed rgba(255,255,255,.6); border-radius: 6px; padding: 0 6px; }
    .marca small { display: block; margin-top: 10px; color: rgba(255,255,255,.75); font-size: 12px; letter-spacing: .02em; }
    nav.menu { padding: 10px 10px; flex: 1; overflow-y: auto; }
    nav.menu a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 2px 0; color: rgba(255,255,255,.86); text-decoration: none; border-radius: 8px; font-weight: 500; }
    nav.menu a:hover { background: rgba(255,255,255,.08); color: #fff; }
    nav.menu a[aria-current="page"] { background: rgba(227,28,105,.16); color: #FF5C98; box-shadow: inset 3px 0 0 var(--fucsia); }
    nav.menu a .num { margin-left: auto; background: var(--azul); color: #fff; font-size: 11px; font-weight: 800; border-radius: 6px; padding: 1px 7px; }
    nav.menu a .num.fucsia { background: var(--fucsia); }
    nav.menu .grupo { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.55); padding: 14px 12px 4px; }
    .ico { width: 18px; height: 18px; flex: none; display: inline-block; }
    .rol { padding: 14px 16px 18px; border-top: 1px solid rgba(255,255,255,.12); }
    .rol label { display: block; font-size: 12px; color: rgba(255,255,255,.75); margin-bottom: 6px; }
    .rol select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 0; color: var(--violeta); font-weight: 600; }
    .rol .quien { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.8); }

    .principal { min-width: 0; display: flex; flex-direction: column; }
    .ficticio { background: var(--turquesa); color: var(--violeta-2); text-align: center; font-weight: 700; font-size: 12.5px; letter-spacing: .03em; padding: 7px 12px; }
    header.barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 20px 28px 18px; background: linear-gradient(90deg, var(--violeta) 0%, #3A2F8F 100%); }
    header.barra h1 { font-size: 24px; margin: 0; color: #fff; flex: 1; min-width: 200px; font-weight: 800; }
    .periodo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .periodo select { padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; }
    .periodo select option { color: var(--tinta); }
    .estado-corrida { padding: 12px 28px 4px; color: var(--tinta-3); font-size: 12.5px; }
    main { padding: 8px 28px 40px; }

    /* ---------- Botones ---------- */
    .btn { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .btn.accion { background: var(--turquesa); color: var(--violeta-2); border-radius: 999px; }
    .btn.accion:hover { background: var(--turquesa-osc); }
    .btn.sec { background: #fff; color: var(--violeta); border: 1px solid var(--borde); }
    .btn.sec:hover { border-color: var(--azul); }
    .btn.peligro { background: #fff; color: var(--grave); border: 1px solid #F1B7B2; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }

    /* ---------- Tarjetas e indicadores ---------- */
    .rejilla { display: grid; gap: 16px; }
    .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 18px; }
    .kpi .etq { color: var(--tinta-2); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .kpi .valor { font-size: 28px; font-weight: 700; color: var(--violeta); margin-top: 6px; letter-spacing: -.01em; }
    .kpi .sub { font-size: 12px; color: var(--tinta-3); margin-top: 2px; }
    .kpi { border-top: 4px solid var(--azul); }
    .kpi.destacado { border-top-color: var(--fucsia); }
    .kpi.accionable { border-top-color: var(--turquesa); }
    .kpi.violeta { border-top-color: var(--violeta); }
    h2 { font-size: 16px; color: var(--violeta); margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
    h2 .ayuda { font-size: 12.5px; font-weight: 400; color: var(--tinta-3); }
    h3 { font-size: 14px; margin: 0 0 10px; color: var(--tinta); }
    .dos { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }

    /* Barras de una sola serie (avance por estado) */
    .barras { display: grid; gap: 10px; }
    .barra-fila { display: grid; grid-template-columns: 170px 1fr 56px; align-items: center; gap: 10px; }
    .barra-fila .nombre { font-size: 13px; color: var(--tinta-2); }
    .pista { background: #EEF1F8; border-radius: 4px; height: 10px; overflow: hidden; }
    .relleno { height: 100%; background: var(--azul); border-radius: 0 4px 4px 0; }
    .barra-fila .cant { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ---------- Chips de estado (siempre con texto e ícono) ---------- */
    .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .chip.ok { background: var(--ok-f); color: var(--ok); }
    .chip.aviso { background: var(--aviso-f); color: var(--aviso); }
    .chip.grave { background: var(--grave-f); color: var(--grave); }
    .chip.info { background: var(--info-f); color: #1F5F87; }
    .chip.neutro { background: #EEF0F6; color: var(--tinta-2); }

    /* ---------- Tablas y listas ---------- */
    .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .filtros input, .filtros select { padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; min-width: 0; }
    .filtros input { flex: 1; min-width: 180px; }
    .tabla { width: 100%; border-collapse: collapse; }
    .tabla th { text-align: left; font-size: 12px; color: var(--tinta-3); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--borde); background: #FAFBFE; }
    .tabla td { padding: 12px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
    .tabla tr.clic { cursor: pointer; }
    .tabla tr.clic:hover td { background: #F7F9FE; }
    .tabla .monto { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .caso-id { font-weight: 700; color: var(--violeta); }
    .tenue { color: var(--tinta-3); font-size: 12.5px; }
    .contenedor-tabla { overflow-x: auto; }
    .tarjetas-movil { display: none; }

    /* Comprobantes */
    .archivos { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .archivo .vista { height: 120px; border-radius: 8px; background: repeating-linear-gradient(135deg, #EEF1F8 0 10px, #F6F8FC 10px 20px); display: flex; align-items: center; justify-content: center; color: var(--tinta-3); font-size: 12px; text-align: center; padding: 8px; margin-bottom: 10px; }
    .archivo .linea { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 6px; }

    /* Conciliación BAC */
    .comparacion { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: stretch; }
    .comparacion .lado { background: #FAFBFE; border: 1px solid var(--borde); border-radius: 10px; padding: 14px; }
    .comparacion .lado h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .04em; }
    .comparacion dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
    .comparacion dt { color: var(--tinta-3); font-size: 12.5px; }
    .comparacion dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
    .comparacion .centro { display: flex; align-items: center; justify-content: center; }
    .difiere { color: var(--grave); }

    /* Historial */
    .linea-tiempo { list-style: none; margin: 0; padding: 0; }
    .linea-tiempo li { position: relative; padding: 0 0 16px 26px; }
    .linea-tiempo li::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--borde); }
    .linea-tiempo li:last-child::before { display: none; }
    .linea-tiempo .punto { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--azul); background: var(--azul); }
    .linea-tiempo .punto.ok { background: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
    .linea-tiempo .punto.grave { background: var(--grave); box-shadow: 0 0 0 2px var(--grave); }

    /* Alertas */
    .alertas { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .alerta { border-left: 5px solid var(--aviso); }
    .alerta.grave { border-left-color: var(--grave); }
    .alerta .cabeza { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .alerta p { margin: 8px 0 12px; color: var(--tinta-2); }

    /* Panel de detalle (cajón lateral) */
    .velo { position: fixed; inset: 0; background: rgba(27,31,69,.35); display: none; z-index: 20; }
    .velo.abierto { display: block; }
    .cajon { position: fixed; top: 0; right: 0; height: 100vh; width: min(640px, 100%); background: var(--fondo); z-index: 21; transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(27,31,69,.15); }
    .cajon.abierto { transform: none; }
    .cajon header { background: var(--violeta); color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .cajon header h2 { color: #fff; margin: 0; flex: 1; font-size: 18px; }
    .cajon .cerrar { background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .pestanas { display: flex; gap: 4px; padding: 10px 16px 0; background: #fff; border-bottom: 1px solid var(--borde); overflow-x: auto; }
    .pestanas button { background: none; border: 0; padding: 10px 12px; font-weight: 600; color: var(--tinta-3); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
    .pestanas button[aria-selected="true"] { color: var(--violeta); border-bottom-color: var(--fucsia); }
    .cajon .cuerpo { padding: 18px 20px 30px; overflow-y: auto; flex: 1; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--tinta-2); font-weight: 600; }
    .form input, .form select { padding: 9px 10px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; font-weight: 400; }
    .form .ancho { grid-column: 1 / -1; }
    .form .check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .aviso-caja { background: var(--info-f); border-radius: 10px; padding: 12px 14px; color: #1F4E6E; font-size: 13px; margin-bottom: 14px; }
    .aviso-caja.fucsia { background: #FCE6EF; color: #8E1042; }
    .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--violeta); color: #fff; padding: 12px 18px; border-radius: 10px; box-shadow: var(--sombra); opacity: 0; transition: all .2s; z-index: 40; max-width: calc(100% - 32px); }
    .toast.ver { opacity: 1; transform: translateX(-50%); }

    .sin-acceso { text-align: center; padding: 40px 20px; }
    .sin-acceso .ico { width: 40px; height: 40px; color: var(--azul); }

    /* ---------- Móvil ---------- */
    .barra-movil, .menu-movil { display: none; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .lateral { display: none; }
      .barra-movil { display: flex; align-items: center; gap: 10px; background: var(--violeta); color: #fff; padding: 10px 16px; position: sticky; top: 0; z-index: 10; }
      .barra-movil .logo { padding: 0; }
      .barra-movil .logo img, .barra-movil .logo .reservado { height: 48px; }
      .barra-movil .logo .reservado { font-size: 9px; padding: 0 6px; }
      .barra-movil select { margin-left: auto; padding: 6px 8px; border-radius: 8px; border: 0; color: var(--violeta); font-weight: 600; max-width: 52%; }
      .menu-movil { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--violeta); z-index: 15; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
      .menu-movil a { color: rgba(255,255,255,.8); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; padding: 4px 2px; border-radius: 8px; flex: 1; position: relative; }
      .menu-movil a[aria-current="page"] { color: var(--turquesa); }
      .menu-movil a .num { position: absolute; top: 0; right: 18%; background: var(--fucsia); color: #fff; font-size: 9.5px; border-radius: 8px; padding: 0 5px; }
      header.barra { padding: 14px 16px 14px; }
      header.barra h1 { font-size: 19px; }
      .estado-corrida { padding: 10px 16px 4px; }
      main { padding: 6px 16px 90px; }
      .dos, .comparacion { grid-template-columns: 1fr; }
      .comparacion .centro { transform: rotate(90deg); }
      .barra-fila { grid-template-columns: 120px 1fr 40px; }
      .contenedor-tabla.responsive { display: none; }
      .tarjetas-movil { display: grid; gap: 10px; }
      .caso-movil { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 14px; display: grid; gap: 6px; cursor: pointer; }
      .caso-movil .fila { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
      .form { grid-template-columns: 1fr; }
      .kpi .valor { font-size: 24px; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
      .tarjeta { padding: 14px; }
    }
  </style>
</head>

        else b.appendChild(el('div', { clase: 'tarjeta tenue', style: 'margin-top:12px' }, 'Solo una aprobadora puede aprobar o rechazar.'));
